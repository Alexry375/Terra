[package]
name = "terra-pont"
version = "0.1.0"
edition = "2021"

# Le pont WebAssembly : il n'ajoute AUCUNE règle de jeu. Il ne fait que
# (1) charger la base de cartes du moteur, (2) appeler `engine::sim` /
# `engine::flow`, (3) sérialiser en JSON ce que le moteur rend.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
engine = { path = "../../../engine" }
serde_json = "1"
rand = "0.8"

# `rand` 0.8.7 amont, à UN écart près : en dessous de 64 bits, `usize`
# s'échantillonne comme `u64`. Sans cela, `rng.gen_range(0..n)` sur un `usize`
# ne tire pas la même valeur en WebAssembly que sur cet ordinateur, et le moteur
# répond différemment du binaire natif à des questions pourtant déterministes
# (`--probe` des 19 cartes qui améliorent une carte Phase). Voir le commentaire
# en tête de l'écart, dans `vendor/rand-usize64/src/distributions/uniform.rs`,
# et le Decision Log du journal.
[patch.crates-io]
rand = { path = "../../vendor/rand-usize64" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
