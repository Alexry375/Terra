<!doctype html>
<!-- La page est en anglais : tout ce que le joueur lit l'est, comme les cartes.
     Ce qui explique le code, lui, reste en français (voir `vue/mots.js`). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra — Ares Expedition</title>
<!-- Rien n'est chargé de l'extérieur : ni police, ni bibliothèque, ni image.
     Le dossier se suffit à lui-même, où qu'on le pose. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<!-- COUTURE DES TROIS CHANTIERS. Chacun a écrit SA feuille à côté de `style.css`
     plutôt que dedans, précisément pour que la fusion n'ait rien à arbitrer :
     les trois se chargent APRÈS la feuille commune, et aucune ne réécrit une
     règle d'une autre.
       · `style-table.css`  (table-vivante)    la table, le geste, les docks
       · `style-monde.css`  (bandeau-et-monde) le bandeau, les arcs, les océans
       · `style-menu.css`   (menu-et-options)  l'accueil, les options, l'aide
     `style-menu.css` vient en DERNIER : c'est lui qui porte le coupe-circuit des
     animations (`html[data-animations="non"] *`), et un coupe-circuit doit
     pouvoir éteindre ce que les deux autres feuilles ont allumé. -->
<link rel="stylesheet" href="./style-table.css">
<link rel="stylesheet" href="./style-monde.css">
<!--   · `style-vente.css`  (regles-de-la-vente) le bouton de vente et la marque
         des cartes désignées. Même règle : rien d'une autre feuille n'est
         réécrit, et elle passe avant `style-menu.css`, qui garde le dernier
         mot sur les animations. -->
<link rel="stylesheet" href="./style-vente.css">
<link rel="stylesheet" href="./style-menu.css">
</head>
<body data-phase="chargement">
<!-- LA TABLE — apport de `table-vivante`, seul chantier à écrire quelque chose
     en dur dans la page (les deux autres ne bâtissent qu'en JavaScript) : il n'y
     a donc rien à arbitrer ici, le bloc est repris tel quel.
     C'est le meuble, pas un décor : elle existe avant le premier octet
     de script, elle ne dépend d'aucun chargement, et c'est sur elle qu'on dépose
     une carte pour la jouer. `interface.js` y pose ensuite la scène de la
     décision — la question s'affiche donc SUR la table, à l'endroit même où la
     carte vient se poser. -->
<div id="milieu" data-table-siege>
  <div id="depot" aria-hidden="true"><span id="depot-mot"></span></div>
</div>
<!-- Le décor, les deux équipages, les deux mains et le reste sont bâtis par
     `interface.js` à partir de l'état que le moteur rend. La page ne contient
     aucun nombre écrit d'avance. -->
<script type="module" src="./interface.js"></script>
</body>
</html>
