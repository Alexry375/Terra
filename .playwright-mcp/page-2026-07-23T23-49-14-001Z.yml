              - generic [ref=f4e207]: "This is an Excel spreadsheet listing all of the cards in the base game and in the KS promo pack. Information listed includes card #, Card color (blue, red, green), card cost (MC), card name, card tags, Phases it can be played, VP, and icons.Some interesting stats:There are 208 base game cards (219 including the promos).Blue cards 64 (68)Red cards 38 (40)Green cards 106 (111).The total VP on all cards is 70 (71); plus there are 12 variable-point (*) cards (13)Total tags on all cards is 291 (305)Total MC cost of all cards is 2750 (2888)Tags ranked according to prevalence: Building, Space, Event, Science, Energy, Plant, Earth, Microbe, Jovian, Animal."
