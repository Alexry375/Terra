                - generic [ref=f19e433]:
                  - generic [ref=f19e434]:
                    - generic [ref=f19e435]:
                      - article [ref=f19e437]:
                        - generic [ref=f19e438]:
                          - paragraph [ref=f19e439]:
                            - emphasis [ref=f19e440]:
                              - strong [ref=f19e441]: "Terraforming Mars: Ares Expedition"
                            - text: is an engine-building game in which players control interplanetary corporations with the goal of making Mars habitable (and profitable). You will do this by investing
                            - strong [ref=f19e442]: mega credits (MC)
                            - text: into project cards that will directly or indirectly contribute to the terraforming process. In order to win, you will want to accumulate a high
                            - strong [ref=f19e443]: terraform rating (TR)
                            - text: and as many
                            - strong [ref=f19e444]: victory points (VP)
                            - text: "as you can. Players raise their TR by increasing global parameters:"
                            - strong [ref=f19e445]: oceans, oxygen, and temperature.
                            - text: TR also determines each corporation's basic income, and, at the end of the game TR counts as VP. Additional VP and production capabilities are awarded for building project cards and other actions taken during the game.
                          - paragraph [ref=f19e446]:
                            - text: The game is played in rounds, and each round the players will choose one of five phases, which determines which activities will take place during that round. This means every round is different, but can consist of building new project cards, taking general and project-specific actions, producing income and resources
                            - strong [ref=f19e447]: (plants and heat)
                            - text: ", or researching to draw more project cards. Every player will take all the phases selected for the round, and will receive a special bonus during the phase that they selected."
                            - strong [ref=f19e448]: To speed up the game, within each phase, players can act simultaneously without waiting for each other!
                          - paragraph [ref=f19e449]: The game board has tracks for oxygen, temperature, and terraform rating, as well as a place for all of the ocean tiles that will be flipped over the course of the game. The game ends when there is enough oxygen to breath (14%), oceans enough to allow Earth-like weather (9), and the temperature is well above freezing (+8°C). It will then be possible, if not comfortable, to live on the surface of Mars!
                          - paragraph [ref=f19e450]: The winner is the player with the most VP at the end of the game.
