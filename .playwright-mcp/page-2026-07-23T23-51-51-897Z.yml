        - generic [ref=f45e86]:
          - heading "Summary" [level=3] [ref=f45e87]
          - list [ref=f45e88]:
            - listitem [ref=f45e89]: Game mechanics, the systems or processes that comprise the core of a game, are not copyrightable, while thematic elements such as written rules, game boards, and card artwork may be.
            - listitem [ref=f45e90]: A trademark can protect a board game’s name and distinctive elements, distinguishing it from others; notable cases, like Monopoly, have shaped trademark law regarding generic terms.
            - listitem [ref=f45e91]: While game mechanics may not be copyrightable, they can be patentable if unique and nonobvious, allowing the patent owner to exclude others from using those mechanics.
            - listitem [ref=f45e92]: IP rights related to board game expansions and adaptations can complicate ownership and distribution.
