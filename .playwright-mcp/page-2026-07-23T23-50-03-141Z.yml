                  - text: (edited)
            - generic [ref=f32e208]:
              - text: Hi, because of situation in Europe I left my city and couldn't play with my friends.So I decided to make an unofficial online implementation of the game. I implemented the whole game flow, just missing promo cards implementation and some corporations.I have tested it with my friends, but would like to invite more people and play it together.The application is hosted on heroku, if you are interested in playing it online leave a message here and I will send a geekmail with a link to heroku application.I can also play together with you, let's just schedule the time or connect in discord.Quite simple UI implemented so far, "new game", where you can select 1 to 3 people right now, each player will get a link to his own view, and "cards list", where you can see all implemented cards(except corporations).If you find any bugs or have any suggestions, feedback or complaints, you can write it here or in private messages to me.If this will help, I can also post some screenshots of the gameplay.Sharing the link here, because received too many private messages.
              - link "https://expedition-ares-fe.herokuapp.com/index" [ref=f32e209] [cursor=pointer]:
                - /url: https://expedition-ares-fe.herokuapp.com/index
              - text: It uses a free hosting, may take 30 seconds after pressing the "Create" to provide the links for the game. After that the game will go smoothly and without any delays.
              - strong [ref=f32e210]: Easy computer player also available.
              - strong [ref=f32e211]: "If anyone stumbles upon creating a new game, here is a short instruction:"
              - text: 1)Select number of players.2)Input player name for each player.3)Wait until the blue links to the game appear. You need to copy the link of your friend (right click -> copy link address) and send it to your friend.4)After you send the links to your friends, now you can navigate to your own link - by just clicking it.5)If you immediately click on your link - you will be navigated to your own game, and your friend links will be lost. So share the links first!
              - strong [ref=f32e212]: "If you want to play with computer:"
              - text: 1) Select the total number of players (for example 2 - you and computer).2)Input the names, for example Me, and another name AI. For the AI player check the box "Computer".3)Then you will receive the links - both for you and for AI. You don't need AI link but it is just in case if you are interested.
