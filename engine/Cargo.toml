[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

# (l-etalon-natif) LA BALANCE NATIVE. Déclarée à la main plutôt que laissée à la
# découverte automatique : la liste des exécutables du moteur doit se lire ici,
# et non dépendre du contenu d'un dossier.
[[bin]]
name = "duel"
path = "src/bin/duel.rs"

[profile.release]
lto = true
codegen-units = 1
